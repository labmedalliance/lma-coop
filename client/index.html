<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <title>Dokumente – LMA Coop</title>
  <script type="module" src="./src/list.js"></script>
</head>
<body>
  <div class="page">
    <header class="navbar navbar-expand-md d-print-none sticky-top">
      <div class="container-xl">
        <a class="navbar-brand text-reset text-decoration-none" href="/"><img src="/img/lma-logo-mark.svg" alt="" class="brand-logo" width="28" height="28">LMA Coop</a>
        <div class="navbar-nav flex-row order-md-last align-items-center gap-2">
          <span class="text-secondary d-none d-sm-inline" id="me-name"></span>
          <a class="btn btn-ghost-secondary" id="admin-link" href="/admin" hidden><i class="ti ti-shield-lock me-1"></i>Benutzer</a>
          <button class="btn btn-ghost-secondary" id="lang-switch" type="button"></button>
          <button class="btn btn-ghost-secondary" id="logout-btn" type="button">Abmelden</button>
        </div>
      </div>
    </header>
    <div class="page-wrapper">
      <div class="container-xl py-4">
        <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
          <h1 class="page-title me-auto">Dokumente</h1>
          <input class="form-control w-auto" id="filter" type="search" placeholder="Suchen …" aria-label="Dokumente durchsuchen">
          <select class="form-select w-auto" id="state-filter" aria-label="Nach Status filtern">
            <option value="active">Alle außer Archived</option>
            <option value="all">Alle</option>
            <option value="idea">Idee</option>
            <option value="wip">Work in Progress</option>
            <option value="finished">Finished</option>
            <option value="archived">Archived</option>
          </select>
          <button class="btn" id="import-btn" type="button" title="Neues Dokument aus einer Word-Datei (.docx), mit Kommentaren, Änderungen und Zitaten"><i class="ti ti-file-import me-1"></i>Word importieren</button>
          <input type="file" id="import-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
          <button class="btn btn-primary" id="new-doc-btn" type="button"><i class="ti ti-plus me-1"></i>Neues Dokument</button>
        </div>
        <div class="doc-grid" id="doc-grid"></div>
        <p class="text-secondary" id="state-empty" hidden>Keine Dokumente mit diesem Status.</p>
        <div class="empty d-none" id="empty-state">
          <p class="empty-title">Noch keine Dokumente</p>
          <p class="empty-subtitle text-secondary" id="empty-create-hint">Leg ein Dokument an und gib es über „Freigeben" für Kolleg:innen frei.</p>
        </div>
        <section class="mt-5" id="other-section" hidden>
          <h2 class="h3 mb-1">Weitere Dokumente</h2>
          <p class="text-secondary small mb-3">Dokumente von Kolleg:innen. Öffnen kannst du sie nach einer Freigabe –
            beantrage dazu Zugriff.</p>
          <div class="doc-grid" id="other-grid"></div>
        </section>
      </div>
    </div>
  </div>
  <dialog class="cite-dialog" id="delete-dialog" aria-labelledby="delete-title">
    <form method="dialog">
      <h2 class="h3" id="delete-title">Bist du sicher?</h2>
      <p class="text-secondary" id="delete-text"></p>
      <div class="d-flex justify-content-end gap-2">
        <button class="btn" value="cancel" type="submit" autofocus>Abbrechen</button>
        <button class="btn btn-danger" value="ok" type="submit">Löschen</button>
      </div>
    </form>
  </dialog>
</body>
</html>
